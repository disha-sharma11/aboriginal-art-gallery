services:
  db:
    image: postgis/postgis:16-3.4
    container_name: aboriginal-art-gallery-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aboriginal_art_gallery}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: AboriginalArtGallery.Api/Dockerfile
    container_name: aboriginal-art-gallery-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=${POSTGRES_DB:-aboriginal_art_gallery};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5141:8080"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aboriginal-art-gallery-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
