services:
  db:
    image: postgis/postgis:16-3.4
    container_name: aboriginal-art-gallery-db-staging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aboriginal_art_gallery_staging}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_staging:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: AboriginalArtGallery.Api/Dockerfile
    container_name: aboriginal-art-gallery-api-staging
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=${POSTGRES_DB:-aboriginal_art_gallery_staging};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5142:8080"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aboriginal-art-gallery-frontend-staging
    ports:
      - "3001:80"
    depends_on:
      - backend

volumes:
  postgres_data_staging:
